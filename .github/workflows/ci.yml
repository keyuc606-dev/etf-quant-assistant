name: CI

"on":
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify free scheduler
        run: |
          node --check deploy/cloudflare-scheduler/worker.mjs
          node --test deploy/cloudflare-scheduler/worker.test.mjs
      - name: Validate deployment scripts and production image
        run: |
          bash -n deploy/bootstrap-gcp.sh deploy/deploy-gcp.sh
          docker build -t etf-production-check .
          docker run --rm --entrypoint python etf-production-check -c "import quant_assistant.production_job; import quant_assistant.v3"

name: Account Closing Execution Telegram

"on":
  push:
    branches: [main]
    paths: [".automation-triggers/closing.txt"]
  workflow_dispatch:
    inputs:
      session:
        description: Must match this workflow (closing)
        type: choice
        options: [morning, closing]
        default: closing
        required: true
      dry_run:
        description: Validate only; no private state or Telegram access
        type: boolean
        default: true
        required: true


permissions:
  contents: read

concurrency:
  group: account-cloud-state
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      admitted: ${{ steps.trigger.outputs.admitted }}
    steps:
      - name: Reject mismatched session
        if: github.event_name == 'workflow_dispatch'
        env:
          SESSION: ${{ inputs.session }}
        run: test "$SESSION" = "closing"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Admit dedicated trigger-only push
        if: github.event_name == 'push'
        id: trigger
        env:
          SESSION: closing
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: python -m quant_assistant.automation_trigger
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Offline safety verification (never reads secrets or sends)
        run: python -m pytest tests/test_execution_cutoff.py tests/test_execution_schedule.py tests/test_automation_trigger.py -q
  notify:
    needs: validate
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'push' && needs.validate.outputs.admitted == 'true') || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Restore last confirmed account snapshot
        env:
          ACCOUNT_STATE_TOKEN: ${{ secrets.ACCOUNT_STATE_TOKEN }}
          ACCOUNT_STATE_REPO: ${{ secrets.ACCOUNT_STATE_REPO }}
          ACCOUNT_SNAPSHOT_B64: ${{ secrets.ACCOUNT_SNAPSHOT_B64 }}
        run: python -m quant_assistant.cloud_state restore
      - name: Send provisional closing execution plan
        env:
          ACCOUNT_STATE_TOKEN: ${{ secrets.ACCOUNT_STATE_TOKEN }}
          ACCOUNT_STATE_REPO: ${{ secrets.ACCOUNT_STATE_REPO }}
          ACCOUNT_SNAPSHOT_B64: ${{ secrets.ACCOUNT_SNAPSHOT_B64 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m quant_assistant.scheduled_execution closing
      - name: Remove sensitive runtime files
        if: always()
        shell: bash
        run: |
          rm -f data/portfolio.json data/portfolio.json.bak data/portfolio.json.tmp
          rm -f data/trading.sqlite3 data/trading.sqlite3-shm data/trading.sqlite3-wal
          rm -f data/reports/my-portfolio-intraday.md

name: Account Trade Telegram

"on":
  workflow_dispatch:
  schedule:
    # GitHub Actions schedule minimum interval is five minutes; delivery may be delayed.
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: account-cloud-state
  cancel-in-progress: false

jobs:
  process-one-message:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Process one Telegram trade message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ACCOUNT_STATE_TOKEN: ${{ secrets.ACCOUNT_STATE_TOKEN }}
          ACCOUNT_STATE_REPO: ${{ secrets.ACCOUNT_STATE_REPO }}
          ACCOUNT_SNAPSHOT_B64: ${{ secrets.ACCOUNT_SNAPSHOT_B64 }}
        run: python -m quant_assistant.telegram_trade_bot

      - name: Remove sensitive runtime files
        if: always()
        shell: bash
        run: |
          rm -f data/portfolio.json data/portfolio.json.bak data/portfolio.json.tmp
          rm -f data/trading.sqlite3 data/trading.sqlite3-shm data/trading.sqlite3-wal
